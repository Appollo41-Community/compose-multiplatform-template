// Conveyor configuration for desktop app distribution with auto-update.
// Docs: https://conveyor.hydraulic.dev/
//
// Usage:
//   conveyor make site          — build packages for all platforms into output/
//   conveyor make windows-app   — build Windows package only
//   conveyor make mac-app       — build macOS package only
//   conveyor make linux-app     — build Linux package only
//
// The generated output/ directory can be served as a static download site
// that also provides auto-update metadata for each platform.

// Import build metadata (version, main class, JARs) from the Gradle build.
include "#!./gradlew -q :app:desktop:printConveyorConfig"

app {
    // The URL where update metadata and downloads will be hosted.
    // Use "localhost:3000" for local development/testing.
    // Replace with your actual download site URL before publishing.
    site.base-url = "localhost:3000"

    // Human-readable name shown in OS app launchers and installers.
    display-name = "Compose Multiplatform"

    // Reverse-DNS identifier used for OS-level package identity
    // (macOS bundle ID, Windows AUMID, Linux .desktop file).
    rdns-name = "com.appollo41.app"

    // App icon. Conveyor auto-generates all required sizes for each platform.
    // Using the existing iOS app icon as source. Replace with an SVG for best results.
    icons = "app/ios/iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png"

    // License shown in installers. Use SPDX identifier.
    // Change this to match your actual license.
    license = "MIT"
}

// Conveyor config format version.
conveyor.compatibility-level = 17
